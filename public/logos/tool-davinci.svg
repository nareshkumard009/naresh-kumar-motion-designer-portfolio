<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <rect width="48" height="48" rx="10" fill="#13151f" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  <g transform="translate(24, 24)">
    <!-- Red / Coral Petal -->
    <path d="M 0 -13 C 5.5 -13 11 -8 11.5 -1 C 11.8 3.5 8.5 7.5 4 8 C 1.5 6 0 3 0 0 Z" fill="#FF4757"/>
    <!-- Green Petal (rotated 120deg) -->
    <path d="M 0 -13 C 5.5 -13 11 -8 11.5 -1 C 11.8 3.5 8.5 7.5 4 8 C 1.5 6 0 3 0 0 Z" fill="#2ED573" transform="rotate(120)"/>
    <!-- Blue Petal (rotated 240deg) -->
    <path d="M 0 -13 C 5.5 -13 11 -8 11.5 -1 C 11.8 3.5 8.5 7.5 4 8 C 1.5 6 0 3 0 0 Z" fill="#1E90FF" transform="rotate(240)"/>
    <!-- Center Pinwheel Core -->
    <circle cx="0" cy="0" r="2.5" fill="#FFA502"/>
  </g>
</svg>
